<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SVG Bicycle Drivetrain Generator ESM Demo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 900px; margin: 0 auto; padding: 32px; }
      #demo { min-height: 360px; }
    </style>
  </head>
  <body>
    <main>
      <h1>ESM Drivetrain Demo</h1>
      <div id="demo"></div>
    </main>
    <script type="module">
      import { renderDrivetrainSvg } from '../../dist/index.mjs';

      document.querySelector('#demo').innerHTML = renderDrivetrainSvg({
        preset: 'gravelWideRange',
        selectedCog: 33,
        style: 'oilSlick',
        animation: { enabled: true, rpm: 72 }
      });
    </script>
  </body>
</html>
